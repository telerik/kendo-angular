<div>
    <button kendoButton fillMode="flat" [svgIcon]="postHeartIcon(card)" (click)="postLikesCount(card)"></button>
    <button kendoButton fillMode="flat" [svgIcon]="commentIcon" (click)="commentClick(card)"></button>
    <button kendoButton fillMode="flat" [svgIcon]="shareIcon"></button>
</div>
<span class="post-likes-count">{{ card.postLikes }} likes</span>
