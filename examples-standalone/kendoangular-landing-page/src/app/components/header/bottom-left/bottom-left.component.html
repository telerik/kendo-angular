<div class="dashboard-controls">
    <div class="dashboard-controls__illustration-row">
        <div class="dashboard-controls__illustration">
            <div class="dashboard-controls__figure">
                <div [innerHTML]="getKendokaSvg()"></div>
            </div>
        </div>

        <div class="dashboard-surface dashboard-surface--slider">
            <kendo-slider
                class="dashboard-controls__slider"
                [fixedTickWidth]="9.5"
                [min]="1"
                [max]="10"
                [smallStep]="1"
                [(value)]="sliderValue"
                tickPlacement="none"
            ></kendo-slider>
        </div>
    </div>

    <div class="dashboard-controls__chart-wrapper">
        <div
            class="dashboard-surface dashboard-surface--chart"
        >
            <div class="dashboard-controls__chart-content">
                <kendo-chart class="dashboard-controls__chart">
                    <kendo-chart-title
                        text="Work Week Tracker"
                        font="var(--kendo-font-size-sm) var(--kendo-font-family)"
                        [padding]="0"
                    ></kendo-chart-title>
                    <kendo-chart-legend
                        position="bottom"
                        orientation="horizontal"
                        [labels]="{ font: 'var(--kendo-font-size-xs) var(--kendo-font-family)' }"
                        [padding]="0"
                        [margin]="0"
                    ></kendo-chart-legend>
                    <kendo-chart-category-axis>
                        <kendo-chart-category-axis-item
                            [categories]="categories"
                            [labels]="{ padding: 0, margin: 0, font: 'var(--kendo-font-size-xs) var(--kendo-font-family)' }"
                        ></kendo-chart-category-axis-item>
                    </kendo-chart-category-axis>
                    <kendo-chart-value-axis>
                        <kendo-chart-value-axis-item
                            [labels]="{ padding: 0, margin: 0, font: 'var(--kendo-font-size-xs) var(--kendo-font-family)' }"
                        ></kendo-chart-value-axis-item>
                    </kendo-chart-value-axis>
                    <kendo-chart-series>
                        <kendo-chart-series-item
                            type="column"
                            name="Coffees"
                            [gap]="2"
                            [spacing]="0.25"
                            [data]="chartFirstSeries"
                            color="var(--kendo-color-series-a-subtler)"
                        >
                        </kendo-chart-series-item>
                        <kendo-chart-series-item
                            type="column"
                            name="Commits"
                            [data]="chartSecondSeries"
                            color="var(--kendo-color-series-b)"
                        >
                        </kendo-chart-series-item>
                        <kendo-chart-series-item
                            type="column"
                            name="Push-ups"
                            [data]="chartThirdSeries"
                            color="var(--kendo-color-primary)"
                        >
                        </kendo-chart-series-item>
                    </kendo-chart-series>
                </kendo-chart>
            </div>
        </div>
    </div>

    <div class="dashboard-controls__actions">
        <div
            class="dashboard-surface dashboard-surface--action"
        >
            <div class="dashboard-controls__rating">
                <kendo-rating [(value)]="ratingValue" [precision]="'half'"></kendo-rating>
            </div>
        </div>
        <div
            class="dashboard-surface dashboard-surface--action"
        >
            <div class="dashboard-controls__switch">
                <kendo-switch [(ngModel)]="switchValue" [size]="'small'"></kendo-switch>
            </div>
        </div>
    </div>
</div>
