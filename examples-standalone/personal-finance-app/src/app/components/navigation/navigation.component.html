<kendo-drawer-container class="application-shell">
    <kendo-drawer #drawer class="application-drawer" [items]="items" [mini]="true"
        [(expanded)]="expanded" mode="overlay" (select)="onItemSelection($event)">
        <ng-template kendoDrawerHeaderTemplate>
            <div class="k-drawer-items">
                <div class="k-drawer-item header-item" (click)="drawer.toggle()">
                    <kendo-svg-icon [icon]="menuIcon"></kendo-svg-icon>
                    @if(expanded){
                    <span>{{ customMsgService.translate('menu') }}</span>
                    }
                </div>
            </div>
        </ng-template>
        <ng-template kendoDrawerItemTemplate let-item>
            <div class="k-drawer-link" [routerLink]="'./' + item.path">
                <kendo-svg-icon [icon]="item.svgIcon"></kendo-svg-icon>
                @if(expanded){
                <span>{{ item.text }}</span>
                }
            </div>
        </ng-template>
    </kendo-drawer>

    <kendo-drawer-content [style.paddingLeft.px]="50" class="application-content">
        <div class="application-page-shell">
            <app-header></app-header>
            <div class="application-main">
                <router-outlet></router-outlet>
            </div>
            <app-footer></app-footer>
        </div>
    </kendo-drawer-content>
</kendo-drawer-container>
