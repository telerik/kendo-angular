<div class="investments-page">
    <h4 class="k-h4 page-title">{{ customMsgService.translate('investments') }}</h4>
    <div class="investments-grid">
        <div
            class="investment-panel investments-overview-panel"
        >
            <div class="panel-heading">
                <h6 class="k-h6 panel-title">{{ customMsgService.translate('totalInvestments') }}</h6>
                <span class="panel-value">Placeholder</span>
            </div>
            <div class="panel-content">
                <kendo-chart>
                    <kendo-chart-legend [position]="legendPosition">
                        <kendo-chart-legend-item cursor="pointer"></kendo-chart-legend-item>
                    </kendo-chart-legend>
                    <kendo-chart-series>
                        <kendo-chart-series-item
                            type="pie"
                            [data]="pieData"
                            field="value"
                            categoryField="category"
                            [labels]="{
                                visible: true,
                                content: labelContent,
                                position: 'center',
                                background: 'transparent'
                            }"
                        ></kendo-chart-series-item>
                    </kendo-chart-series>
                </kendo-chart>
            </div>
        </div>
        <div
            class="investment-panel movers-panel"
        >
            <div class="panel-heading">
                <h6 class="k-h6 panel-title movers-title">{{ customMsgService.translate('todayMovers') }}</h6>
            </div>
            <div class="movers-list">
                @for(currencyMover of currencyMovers; track currencyMover){
                <app-currency-mover [currencyMover]="currencyMover"></app-currency-mover>
                }
            </div>
        </div>
    </div>
    <div
        class="investment-panel stock-chart-panel"
    >
        <div class="panel-heading">
            <h6 class="k-h6 panel-title">{{ customMsgService.translate('stockChart') }}</h6>
        </div>
        <div class="panel-content centered-content">
            <app-stock-chart></app-stock-chart>
        </div>
    </div>
</div>
