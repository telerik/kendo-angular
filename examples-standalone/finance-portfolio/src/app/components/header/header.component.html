<header class="header">
  <div class="container header-content">
    <div class="header-copy">
      <h1 class="mb-0 header-title">My Stocks Portfolio</h1>
    </div>
    <div class="header-controls">
      <kendo-dropdownlist
        [data]="listItems"
        [style.width.px]="160"
        [(value)]="selected"
        (valueChange)="onCurrencyChange($event)"
        aria-label="Currency"
      ></kendo-dropdownlist>
      <div class="profile-image" role="img" aria-label="User avatar"></div>
    </div>
  </div>
</header>
