<div
    class="selected-stock-badge d-flex align-items-center"
    [ngClass]="{ 'badge-positive-value': item.change_pct > 0, 'badge-negative-value': item.change_pct < 0 }"
>
    <span>{{ item.symbol }} </span>
    <span>{{ item.price }}</span>
    <span>{{ item.change_pct > 0 ? '↑ gain' : item.change_pct < 0 ? '↓ loss' : '— unchanged' }}</span>
</div>
