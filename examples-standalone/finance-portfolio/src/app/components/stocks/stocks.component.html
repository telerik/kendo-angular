<kendo-splitter #portfolioSplitter [orientation]="'vertical'" style="height: 100%">
    <kendo-splitter-pane class="splitter-upper-pane">
        <app-stock-chart></app-stock-chart>
    </kendo-splitter-pane>
    <kendo-splitter-pane>
        <app-badge #selectedStockBadge [item]="stockDataService.selectedStock"></app-badge>
        <app-stock-list [showGrid]="selectedView === 'results'">
            <nav portfolio-view-switcher class="portfolio-view-switcher" aria-label="Portfolio data view">
                <kendo-buttongroup selection="single">
                    <button
                        kendoButton
                        [toggleable]="true"
                        [selected]="selectedView === 'results'"
                        (click)="selectView('results')"
                    >
                        Result List
                    </button>
                    <button
                        kendoButton
                        [toggleable]="true"
                        [selected]="selectedView === 'virtualization'"
                        (click)="selectView('virtualization')"
                    >
                        Data Virtualization
                    </button>
                </kendo-buttongroup>
            </nav>
        </app-stock-list>

        @if (selectedView === 'virtualization') {
            <app-real-time-data></app-real-time-data>
        }
    </kendo-splitter-pane>
</kendo-splitter>
