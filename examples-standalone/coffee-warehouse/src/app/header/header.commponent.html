<div class="header header-bg">
  <div class="nav-container">
    <div class="menu-button">
      <button kendoButton fillMode="flat" [svgIcon]="menuIcon" (click)="onButtonClick()" [attr.aria-label]="customMsgService.translate('toggleNavigation')">
      </button>
    </div>

    <div class="title">
      <h1>{{ this.customMsgService.translate('warehouse') }}</h1>
      <span class="vl"></span>
      @if (selectedPage) {
        <h2>{{ this.customMsgService.translate(selectedPage.toLowerCase()) }}</h2>
      }
    </div>

    <div class="settings">
      <kendo-dropdownlist
        [data]="locales"
        textField="locale"
        valueField="localeId"
        [value]="selectedLanguage"
        (valueChange)="changeLanguage($event)"
        [popupSettings]="popupSettings"
        class="ddl-locale"
        >
      </kendo-dropdownlist>
    </div>

    <kendo-avatar [imageSrc]="profileImage" shape="circle"> </kendo-avatar>
  </div>
</div>
