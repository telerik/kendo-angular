<kendo-appbar positionMode="sticky" position="top" themeColor="base">
    <kendo-appbar-section class="logo-nav-container">
        <div class="logo" routerLink="/login">Sample Event</div>
        <button
            kendoButton
            class="navigation-toggle"
            fillMode="clear"
            themeColor="primary"
            size="large"
            type="button"
            [attr.aria-expanded]="isNavigationOpen"
            aria-controls="primary-navigation"
            (click)="toggleNavigation()"
        >
            <kendo-svgicon [icon]="menuIcon"></kendo-svgicon>
            <span>Menu</span>
        </button>
        <nav id="primary-navigation" class="nav-buttons" [class.is-open]="isNavigationOpen" aria-label="Primary navigation">
            <button
                kendoButton
                themeColor="primary"
                rounded="medium"
                fillMode="clear"
                size="large"
                routerLink="/event-budget"
                routerLinkActive="active"
                (click)="closeNavigation()"
                >Event Budget</button
            >
            <button
                kendoButton
                themeColor="primary"
                rounded="medium"
                fillMode="clear"
                size="large"
                routerLink="/tickets"
                routerLinkActive="active"
                (click)="closeNavigation()"
                >Tickets</button
            >
            <button
                kendoButton
                themeColor="primary"
                rounded="medium"
                fillMode="clear"
                size="large"
                routerLink="/speakers"
                routerLinkActive="active"
                (click)="closeNavigation()"
                >Call for Speakers</button
            >
        </nav>
    </kendo-appbar-section>

    <kendo-appbar-spacer></kendo-appbar-spacer>

    <kendo-appbar-section class="username-logout-container">
        <span class="user-title">Hello, {{ roleName }}</span>
        <button 
            kendoButton 
            fillMode="clear" 
            themeColor="primary" 
            routerLink="/login" 
            routerLinkActive="active"
        >
            <kendo-svgicon [icon]="logoutIcon"></kendo-svgicon>
            <span>Logout</span>
        </button>
    </kendo-appbar-section>
</kendo-appbar>
