<div class="app-shell">
  <header class="app-header">
    <a class="brand" routerLink="/home" aria-label="Electron sales dashboard home">
      <span class="brand-mark" aria-hidden="true">K</span>
      <span>Sales workspace</span>
    </a>
    <nav *ngIf="showWorkspaceNav" class="primary-nav" aria-label="Primary navigation">
      <a routerLink="/home" routerLinkActive="active">Dashboard</a>
      <a routerLink="/detail" routerLinkActive="active">Analytics</a>
      <a routerLink="/notifications" routerLinkActive="active">Notifications</a>
      <a routerLink="/help" routerLinkActive="active">Help</a>
    </nav>
    <div *ngIf="showWorkspaceNav" class="account-actions">
      <a routerLink="/settings" aria-label="Open settings">Settings</a>
      <a routerLink="/profile" class="avatar" aria-label="Open profile">AM</a>
    </div>
  </header>
  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>
