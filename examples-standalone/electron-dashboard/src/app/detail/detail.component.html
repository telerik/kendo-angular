<section class="page-heading">
  <div>
    <p class="eyebrow">Revenue performance</p>
    <h1>Sales analytics</h1>
    <p>Quarterly performance with projected revenue based on current activity.</p>
  </div>
  <a kendoButton fillMode="outline" routerLink="/home">Back to dashboard</a>
</section>
<section class="chart-panel" aria-labelledby="trend-heading">
  <div class="panel-header">
    <div>
      <h2 id="trend-heading">Revenue trend and forecast</h2>
      <p>Actual sales are shown alongside linear and polynomial projections.</p>
    </div>
    <span>Updated today</span>
  </div>
    <kendo-chart
      [pannable]="{ lock: 'y' }"
      [zoomable]="{ mousewheel: { lock: 'y' } }"
    >
      <kendo-chart-title text="Trendlines"></kendo-chart-title>
      <kendo-chart-series>
        <kendo-chart-series-item
          name="Sales By Quarter"
          type="line"
          style="smooth"
          [data]="salesByQuarter"
          field="count"
          categoryField="date"
        >
        </kendo-chart-series-item>
        <kendo-chart-series-item
          name="Sales Forecast (LINEAR)"
          type="linearTrendline"
          for="Sales By Quarter"
        >
          <kendo-chart-series-item-trendline [forecast]="{ after: 10 }">
          </kendo-chart-series-item-trendline>
        </kendo-chart-series-item>
        <kendo-chart-series-item
          name="Trend (POLY)"
          type="polynomialTrendline"
          for="Sales By Quarter"
          color="var(--kendo-color-error)"
        >
          <kendo-chart-series-item-trendline [order]="3">
          </kendo-chart-series-item-trendline>
        </kendo-chart-series-item>
      </kendo-chart-series>
      <kendo-chart-category-axis>
        <kendo-chart-category-axis-item
          baseUnit="auto"
          [maxDivisions]="50"
          [labels]="{ rotation: -90, position: 'start' }"
        >
        </kendo-chart-category-axis-item>
      </kendo-chart-category-axis>
      <kendo-chart-value-axis>
        <kendo-chart-value-axis-item [min]="-4e5" [max]="1.2e6">
        </kendo-chart-value-axis-item>
      </kendo-chart-value-axis>
      <kendo-chart-tooltip format="C">
        <ng-template
          kendoChartSeriesTooltipTemplate
          let-series="series"
          let-value="value"
        >
          {{ series.name }}: {{ value | kendoNumber : "c" }}
        </ng-template>
      </kendo-chart-tooltip>
      <kendo-chart-legend position="bottom"></kendo-chart-legend>
    </kendo-chart>
</section>
